services:
  postgres:
    image: postgres:16-alpine
    container_name: peerconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: peerconnect
      POSTGRES_PASSWORD: peerconnect
      POSTGRES_DB: peerconnect
    ports:
      - "5432:5432"
    volumes:
      - peerconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peerconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  peerconnect_pgdata:
